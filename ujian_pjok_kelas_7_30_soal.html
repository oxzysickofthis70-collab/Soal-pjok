<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian PJOK Kelas 7 - 30 Soal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#08111f,#102a43);color:#fff;min-height:100vh;padding:16px}
.container{max-width:850px;margin:auto}
.card{background:#111c2d;border:1px solid #26364d;border-radius:18px;padding:24px;box-shadow:0 15px 40px #0006}
h1{text-align:center;margin-bottom:8px}.subtitle{text-align:center;color:#9fb0c5;margin-bottom:24px}
#quiz,#result{display:none}
.progress-info{display:flex;justify-content:space-between;color:#aebdd0;font-size:14px;margin-bottom:7px}
.progress{height:8px;background:#243247;border-radius:10px;overflow:hidden}
.progress-bar{width:0;height:100%;background:#22c55e;transition:.3s}
.question-number{color:#22c55e;font-weight:bold;margin:20px 0 10px}
.question{font-size:20px;line-height:1.5;margin-bottom:18px}
.option{display:block;background:#19273a;border:1px solid #30425a;padding:14px;border-radius:12px;margin:10px 0;cursor:pointer}
.option:hover,.option.selected{background:#173b2a;border-color:#22c55e}
.option input{margin-right:10px}
.buttons{display:flex;gap:10px;margin-top:24px}
button{border:0;border-radius:10px;padding:13px 20px;cursor:pointer;font-weight:bold;font-size:15px}
.next,.start-btn,.restart{background:#22c55e;color:#07130c}
.prev{background:#334155;color:#fff}.finish{background:#ef4444;color:#fff;margin-left:auto}
.start-screen{text-align:center}.start-screen h1{font-size:30px}.start-screen p{color:#aebdd0;line-height:1.6;margin:16px 0 25px}
.score{font-size:58px;font-weight:bold;color:#22c55e;margin:20px}
.result-text{color:#b7c4d5}
.review{text-align:left;margin-top:25px}
.review-item{background:#19273a;border-radius:12px;padding:14px;margin:10px 0}
.correct{border-left:5px solid #22c55e}.wrong{border-left:5px solid #ef4444}
.review-item small{display:block;margin-top:7px;color:#aebdd0}
.restart{margin-top:20px}
@media(max-width:600px){body{padding:10px}.card{padding:17px}.question{font-size:18px}.buttons{flex-wrap:wrap}.finish{margin-left:0}}
</style>
</head>
<body>
<div class="container">
<div class="card">

<div id="start" class="start-screen">
<h1>🏆 Ujian PJOK Kelas 7</h1>
<p>30 soal pilihan ganda tentang olahraga dan kebugaran jasmani.<br>Pilih jawaban yang paling tepat.</p>
<button class="start-btn" onclick="startQuiz()">Mulai Ujian</button>
</div>

<div id="quiz">
<div class="progress-info"><span id="counter"></span><span id="answered"></span></div>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div class="question-number" id="qnum"></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div class="buttons">
<button class="prev" onclick="prevQuestion()">← Sebelumnya</button>
<button class="next" id="nextBtn" onclick="nextQuestion()">Berikutnya →</button>
<button class="finish" id="finishBtn" onclick="finishQuiz()">Selesai</button>
</div>
</div>

<div id="result">
<h1>🎉 Hasil Ujian</h1>
<div class="score" id="score"></div>
<div class="result-text" id="resultText"></div>
<div class="review" id="review"></div>
<button class="restart" onclick="location.reload()">Ulangi Ujian</button>
</div>

</div>
</div>

<script>
const questions=[
["Dalam permainan sepak bola, jumlah pemain dalam satu tim yang berada di lapangan adalah...","11 pemain",["7 pemain","9 pemain","11 pemain","12 pemain"]],
["Teknik dasar menendang bola dalam sepak bola disebut...","Shooting",["Dribbling","Shooting","Passing","Heading"]],
["Induk organisasi sepak bola Indonesia adalah...","PSSI",["PBSI","PSSI","PERBASI","PBVSI"]],
["Dalam permainan bola voli, satu regu terdiri dari...","6 pemain",["5 pemain","6 pemain","7 pemain","8 pemain"]],
["Pukulan pertama untuk memulai permainan bola voli disebut...","Servis",["Smash","Block","Servis","Passing"]],
["Teknik menerima bola menggunakan kedua lengan bagian bawah dalam bola voli disebut...","Passing bawah",["Passing atas","Passing bawah","Smash","Servis"]],
["Jumlah pemain bola basket dalam satu tim yang bermain di lapangan adalah...","5 pemain",["4 pemain","5 pemain","6 pemain","7 pemain"]],
["Gerakan membawa bola dengan cara memantulkannya dalam bola basket disebut...","Dribbling",["Passing","Shooting","Dribbling","Pivot"]],
["Tujuan utama permainan bola basket adalah...","Memasukkan bola ke keranjang lawan",["Menjatuhkan lawan","Memasukkan bola ke keranjang lawan","Menendang bola","Memukul bola"]],
["Induk organisasi bola basket Indonesia adalah...","PERBASI",["PSSI","PBSI","PERBASI","PBVSI"]],
["Lari jarak pendek disebut juga...","Sprint",["Jogging","Sprint","Maraton","Jalan cepat"]],
["Start yang digunakan dalam lari jarak pendek adalah...","Start jongkok",["Start berdiri","Start melayang","Start jongkok","Start duduk"]],
["Salah satu nomor lari jarak pendek adalah...","100 meter",["100 meter","1500 meter","5000 meter","10.000 meter"]],
["Dalam atletik, lompat jauh bertujuan untuk mendapatkan...","Jarak lompatan sejauh-jauhnya",["Lompatan setinggi-tingginya","Jarak lompatan sejauh-jauhnya","Waktu tercepat","Lemparan terjauh"]],
["Tahap terakhir dalam lompat jauh adalah...","Mendarat",["Awalan","Tolakan","Melayang","Mendarat"]],
["Alat yang digunakan dalam permainan bulu tangkis untuk memukul kok adalah...","Raket",["Bet","Tongkat","Raket","Glove"]],
["Pukulan keras dan menukik dalam bulu tangkis disebut...","Smash",["Lob","Dropshot","Smash","Servis"]],
["Induk organisasi bulu tangkis Indonesia adalah...","PBSI",["PSSI","PBSI","PERBASI","PBVSI"]],
["Dalam tenis meja, alat untuk memukul bola disebut...","Bet",["Raket","Bet","Glove","Stick"]],
["Gerakan senam yang dilakukan dengan bertumpu pada kedua tangan dan kepala disebut...","Headstand",["Handstand","Headstand","Kayang","Guling depan"]],
["Gerakan berguling ke depan dalam senam lantai disebut...","Guling depan",["Guling belakang","Guling depan","Kayang","Sikap lilin"]],
["Kemampuan tubuh melakukan aktivitas tanpa cepat lelah disebut...","Kebugaran jasmani",["Kelentukan","Kekuatan","Kebugaran jasmani","Kecepatan"]],
["Latihan untuk meningkatkan kekuatan otot lengan adalah...","Push-up",["Sit-up","Push-up","Lari","Jogging"]],
["Latihan sit-up terutama melatih otot...","Perut",["Kaki","Dada","Perut","Leher"]],
["Kemampuan melakukan gerakan dalam waktu singkat disebut...","Kecepatan",["Kekuatan","Kecepatan","Kelentukan","Keseimbangan"]],
["Kemampuan persendian bergerak secara luas disebut...","Kelentukan",["Kelincahan","Kelentukan","Kecepatan","Daya tahan"]],
["Olahraga yang dilakukan secara teratur dapat membantu menjaga...","Kebugaran tubuh",["Kebugaran tubuh","Rasa malas","Kelelahan","Penyakit"]],
["Sebelum melakukan olahraga sebaiknya melakukan...","Pemanasan",["Tidur","Pemanasan","Makan sebanyak-banyaknya","Duduk diam"]],
["Setelah berolahraga sebaiknya melakukan...","Pendinginan",["Pemanasan","Pendinginan","Sprint","Lompat"]],
["Salah satu manfaat pemanasan sebelum olahraga adalah...","Mengurangi risiko cedera",["Membuat tubuh kaku","Mengurangi risiko cedera","Membuat cepat lelah","Mengurangi konsentrasi"]]
];

let current=0, answers=Array(questions.length).fill(null);

function startQuiz(){
document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";
showQuestion();
}
function showQuestion(){
const q=questions[current];
document.getElementById("counter").textContent=`Soal ${current+1} dari ${questions.length}`;
document.getElementById("answered").textContent=`${answers.filter(x=>x!==null).length} terjawab`;
document.getElementById("bar").style.width=((current+1)/questions.length*100)+"%";
document.getElementById("qnum").textContent=`SOAL ${current+1}`;
document.getElementById("question").textContent=q[0];
const box=document.getElementById("options"); box.innerHTML="";
q[2].forEach((opt,i)=>{
const label=document.createElement("label");
label.className="option"+(answers[current]===i?" selected":"");
label.innerHTML=`<input type="radio" name="answer" ${answers[current]===i?"checked":""}> ${String.fromCharCode(65+i)}. ${opt}`;
label.onclick=()=>{answers[current]=i;showQuestion()};
box.appendChild(label);
});
document.getElementById("nextBtn").style.display=current===questions.length-1?"none":"block";
document.getElementById("finishBtn").style.display=current===questions.length-1?"block":"none";
}
function nextQuestion(){if(current<questions.length-1){current++;showQuestion()}}
function prevQuestion(){if(current>0){current--;showQuestion()}}
function finishQuiz(){
if(answers.some(x=>x===null)&&!confirm("Masih ada soal yang belum dijawab. Tetap selesai?"))return;
let score=0;
answers.forEach((a,i)=>{if(a!==null&&questions[i][2][a]===questions[i][1])score++});
let nilai=Math.round(score/questions.length*100);
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("score").textContent=nilai;
document.getElementById("resultText").textContent=`Benar ${score} dari ${questions.length} soal.`;
const review=document.getElementById("review");review.innerHTML="<h3>Pembahasan Jawaban</h3>";
questions.forEach((q,i)=>{
let benar=answers[i]!==null&&q[2][answers[i]]===q[1];
let div=document.createElement("div");
div.className="review-item "+(benar?"correct":"wrong");
div.innerHTML=`<b>${i+1}. ${q[0]}</b><small>Jawaban benar: ${q[1]}<br>Jawaban kamu: ${answers[i]===null?"Tidak dijawab":q[2][answers[i]]}</small>`;
review.appendChild(div);
});
}
</script>
</body>
</html>
